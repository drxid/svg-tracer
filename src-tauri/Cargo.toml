[package]
name = "svg-tracer"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"

[lib]
name = "svg_tracer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
vtracer = "=1.0.0-alpha.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
imageproc = { version = "0.27", default-features = false, features = ["rayon"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
resvg = { version = "0.45", default-features = false, features = ["text"] }

# Трассировка в неоптимизированной сборке медленнее в десятки раз.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
